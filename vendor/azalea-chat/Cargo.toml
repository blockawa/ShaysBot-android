[package]
name = "azalea-chat"
description = "Parse Minecraft chat messages."
version = "0.16.0+mc26.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/azalea-rs/azalea"

[features]
default = []
simdnbt = ["dep:simdnbt"]
azalea-buf = ["dep:azalea-buf", "simdnbt"]
numbers = ["dep:azalea-registry", "simdnbt"]

[dependencies]
azalea-buf = { git = "https://github.com/Shays-Forks/azalea", optional = true, default-features = false, features = ["serde_json"] }
azalea-language = { git = "https://github.com/Shays-Forks/azalea", default-features = false }
azalea-registry = { git = "https://github.com/Shays-Forks/azalea", optional = true, default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
simdnbt = { version = "0.10.0", optional = true }
tracing = "0.1.44"
