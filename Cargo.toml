[package]
name = "shaysbot"
version = "0.17.2"
authors = ["Shayne Hartford <shaybox@shaybox.com>"]
edition = "2024"
description = "My personal Minecraft bot using Azalea"
homepage = "https://git.shaybox.com/shaysbot/releases/latest"
repository = "https://github.com/ShayBox/ShaysBot"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[patch.'https://github.com/azalea-rs/azalea']
azalea = { git = "https://github.com/Shays-Forks/azalea" }
#azalea = { path = "../azalea/azalea" }

# chat 组件解析容错化：26.x 新组件（player/score 等未知结构）降级为空文本
# 而非返回 None，避免 system_chat/set_action_bar_text 整包被丢弃
[patch.'https://github.com/Shays-Forks/azalea']
azalea-chat = { path = "vendor/azalea-chat" }

# ViaProxy 下载目录跟随二进制（原为 $HOME/.minecraft/azalea-viaversion）
[patch.'https://github.com/azalea-rs/azalea-viaversion']
azalea-viaversion = { path = "vendor/azalea-viaversion" }

[patch.crates-io]
ncr = { git = "https://github.com/Shays-Forks/ncr-rs", rev = "4004292" }
# Android/Termux 适配：无 JVM 环境下 DNS 改为返回 Err（走 azalea 的 Google DNS
# fallback）、TLS 改为 webpki 静态根证书验证，避免 ndk-context/JNI panic。
hickory-resolver = { path = "vendor/hickory-resolver" }
rustls-platform-verifier = { path = "vendor/rustls-platform-verifier" }
# aarch64 指针标签（MTE/TBI）导致 NBT 解析错位 panic，应用上游未发布的修复
# （azalea-rs/simdnbt#25: strip pointer tags in Reader::new on aarch64）
simdnbt = { path = "vendor/simdnbt" }

[dependencies]
anyhow = "1"
azalea = { git = "https://github.com/azalea-rs/azalea", default-features = false, features = ["packet-event", "serde", "online-mode"] }
azalea-viaversion = { git = "https://github.com/azalea-rs/azalea-viaversion", optional = true }
#azalea-viaversion = { path = "../azalea-viaversion", optional = true }
base64 = "0.22"
bevy-discord = { version = "0.9", features = ["bot"], optional = true }
bounded-counter = { version = "0.2", features = ["deref", "deref_mut"] }
chrono = "0.4"
derive_more = { version = "2", features = ["full"] }
fastrand = "2"
itertools = "0.14"
lazy-regex = "3"
ncr = { version = "0.1", features = ["cfb8", "ecb", "gcm"] }
parking_lot = "0.12"
serde = "1"
serde_tuple = "1"
serde_with = "3"
serde_yml = "0.0.13"
serenity = { version = "0.12", optional = true }
smart-default = "0.7"
str-macro = "1"
strum = { version = "0.28", features = ["derive"] }
tiny_http = { version = "0.12", optional = true }
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = { version = "3", features = ["json"] }
uuid = "1"

[features]
default = ["api", "bot", "via"]
api = ["dep:tiny_http"]
bot = ["dep:bevy-discord", "dep:serenity"]
via = ["dep:azalea-viaversion"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
needless_pass_by_value = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(bevy_lint)"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
